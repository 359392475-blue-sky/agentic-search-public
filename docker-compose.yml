services:
  agentic-search:
    build: .
    ports:
      - "${PORT:-3200}:3200"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}
      - API_TOKEN=${API_TOKEN}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-30}
    volumes:
      - search-data:/app/data
    restart: unless-stopped

volumes:
  search-data:
